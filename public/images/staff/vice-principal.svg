  <ellipse cx="100" cy="95" rx="38" ry="43" fill="#fcd5b5"/>
  <!-- Glasses -->
  <rect x="70" y="82" width="22" height="16" fill="none" stroke="#374151" stroke-width="1.5" rx="3"/>
  <rect x="108" y="82" width="22" height="16" fill="none" stroke="#374151" stroke-width="1.5" rx="3"/>
  <line x1="92" y1="90" x2="108" y2="90" stroke="#374151" stroke-width="1.5"/>
  <!-- Eyes -->
  <ellipse cx="81" cy="90" rx="4" ry="3" fill="#1e293b"/>
