  <!-- Decorative pattern on hijab -->
  <circle cx="65" cy="130" r="3" fill="#c4b5fd"/>
  <circle cx="135" cy="130" r="3" fill="#c4b5fd"/>
  <circle cx="55" cy="155" r="2" fill="#c4b5fd"/>
  <circle cx="145" cy="155" r="2" fill="#c4b5fd"/>
