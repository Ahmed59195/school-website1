<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="vp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe"/>
      <stop offset="100%" style="stop-color:#bae6fd"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#vp-bg)"/>
  <!-- Hijab outer -->
  <ellipse cx="100" cy="95" rx="60" ry="68" fill="#8b5cf6"/>
