<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="class-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef9c3"/>
      <stop offset="100%" style="stop-color:#fef08a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#class-bg)"/>
  <!-- Floor -->
  <rect x="0" y="320" width="600" height="80" fill="#d6d3d1"/>
  <!-- Windows -->
  <rect x="20" y="30" width="100" height="120" fill="#7dd3fc" stroke="#78716c" stroke-width="5"/>
  <line x1="70" y1="30" x2="70" y2="150" stroke="#78716c" stroke-width="3"/>
  <line x1="20" y1="90" x2="120" y2="90" stroke="#78716c" stroke-width="3"/>
  <rect x="480" y="30" width="100" height="120" fill="#7dd3fc" stroke="#78716c" stroke-width="5"/>
  <line x1="530" y1="30" x2="530" y2="150" stroke="#78716c" stroke-width="3"/>
  <line x1="480" y1="90" x2="580" y2="90" stroke="#78716c" stroke-width="3"/>
  <!-- Blackboard -->
  <rect x="170" y="40" width="260" height="130" fill="#166534" rx="5"/>
  <rect x="165" y="35" width="270" height="140" fill="none" stroke="#78716c" stroke-width="8" rx="8"/>
  <text x="300" y="90" text-anchor="middle" font-family="Comic Sans MS" font-size="20" fill="white">Welcome Students!</text>
  <text x="300" y="130" text-anchor="middle" font-family="Comic Sans MS" font-size="16" fill="#fef08a">A + B = C</text>
  <!-- Teacher desk -->
  <rect x="240" y="190" width="120" height="40" fill="#a16207" rx="3"/>
  <rect x="270" y="228" width="15" height="40" fill="#854d0e"/>
  <rect x="315" y="228" width="15" height="40" fill="#854d0e"/>
  <!-- Books on desk -->
  <rect x="250" y="180" width="30" height="15" fill="#ef4444"/>
  <rect x="285" y="178" width="25" height="17" fill="#3b82f6"/>
  <rect x="315" y="180" width="30" height="15" fill="#22c55e"/>
  <!-- Student desk 1 -->
  <rect x="80" y="280" width="80" height="30" fill="#d4a574" rx="2"/>
  <rect x="90" y="308" width="10" height="30" fill="#b8956c"/>
  <rect x="140" y="308" width="10" height="30" fill="#b8956c"/>
  <!-- Student 1 -->
  <circle cx="120" cy="245" r="18" fill="#fcd5b5"/>
  <ellipse cx="120" cy="275" rx="18" ry="15" fill="#3b82f6"/>
  <rect x="90" y="270" width="20" height="15" fill="#3b82f6"/>
  <rect x="130" y="270" width="20" height="15" fill="#3b82f6"/>
  <!-- Student desk 2 -->
  <rect x="200" y="280" width="80" height="30" fill="#d4a574" rx="2"/>
  <rect x="210" y="308" width="10" height="30" fill="#b8956c"/>
  <rect x="260" y="308" width="10" height="30" fill="#b8956c"/>
  <!-- Student 2 -->
  <circle cx="240" cy="245" r="18" fill="#e8c4a0"/>
  <ellipse cx="240" cy="275" rx="18" ry="15" fill="#ec4899"/>
  <rect x="210" y="270" width="20" height="15" fill="#ec4899"/>
  <rect x="250" y="270" width="20" height="15" fill="#ec4899"/>
  <!-- Student desk 3 -->
  <rect x="320" y="280" width="80" height="30" fill="#d4a574" rx="2"/>
  <rect x="330" y="308" width="10" height="30" fill="#b8956c"/>
  <rect x="380" y="308" width="10" height="30" fill="#b8956c"/>
  <!-- Student 3 -->
  <circle cx="360" cy="245" r="18" fill="#fcd5b5"/>
  <ellipse cx="360" cy="275" rx="18" ry="15" fill="#22c55e"/>
  <rect x="330" y="270" width="20" height="15" fill="#22c55e"/>
  <rect x="370" y="270" width="20" height="15" fill="#22c55e"/>
  <!-- Student desk 4 -->
  <rect x="440" y="280" width="80" height="30" fill="#d4a574" rx="2"/>
  <rect x="450" y="308" width="10" height="30" fill="#b8956c"/>
  <rect x="500" y="308" width="10" height="30" fill="#b8956c"/>
  <!-- Student 4 -->
  <circle cx="480" cy="245" r="18" fill="#e8c4a0"/>
  <ellipse cx="480" cy="275" rx="18" ry="15" fill="#8b5cf6"/>
  <rect x="450" y="270" width="20" height="15" fill="#8b5cf6"/>
  <rect x="490" y="270" width="20" height="15" fill="#8b5cf6"/>
  <!-- Clock -->
  <circle cx="550" cy="200" r="18" fill="white" stroke="#374151" stroke-width="2"/>
  <line x1="550" y1="200" x2="550" y2="188" stroke="#1f2937" stroke-width="2"/>
  <line x1="550" y1="200" x2="560" y2="205" stroke="#1f2937" stroke-width="1.5"/>
  <!-- Map poster -->
  <rect x="30" y="170" width="60" height="80" fill="#bfdbfe" stroke="#6b7280"/>
  <ellipse cx="60" cy="210" rx="20" ry="25" fill="#86efac"/>
</svg>
