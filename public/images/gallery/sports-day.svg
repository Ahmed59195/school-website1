<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="field-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="40%" style="stop-color:#7dd3fc"/>
      <stop offset="40%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#field-bg)"/>
  <!-- Running track lines -->
  <rect x="50" y="250" width="500" height="8" fill="#dc2626" rx="4"/>
  <rect x="50" y="270" width="500" height="8" fill="#dc2626" rx="4"/>
  <rect x="50" y="290" width="500" height="8" fill="#dc2626" rx="4"/>
  <!-- White lane markers -->
  <line x1="150" y1="245" x2="150" y2="305" stroke="white" stroke-width="2"/>
  <line x1="250" y1="245" x2="250" y2="305" stroke="white" stroke-width="2"/>
  <line x1="350" y1="245" x2="350" y2="305" stroke="white" stroke-width="2"/>
  <line x1="450" y1="245" x2="450" y2="305" stroke="white" stroke-width="2"/>
  <!-- Runner 1 -->
  <circle cx="120" cy="220" r="15" fill="#fcd5b5"/>
  <ellipse cx="120" cy="250" rx="12" ry="18" fill="#3b82f6"/>
  <line x1="110" y1="268" x2="100" y2="290" stroke="#fcd5b5" stroke-width="6"/>
  <line x1="130" y1="268" x2="145" y2="285" stroke="#fcd5b5" stroke-width="6"/>
  <text x="120" y="225" text-anchor="middle" font-size="8" fill="#1f2937">1</text>
  <!-- Runner 2 (leading) -->
  <circle cx="380" cy="200" r="18" fill="#e8c4a0"/>
  <ellipse cx="380" cy="235" rx="14" ry="20" fill="#ef4444"/>
  <line x1="368" y1="255" x2="355" y2="280" stroke="#e8c4a0" stroke-width="7"/>
  <line x1="392" y1="255" x2="410" y2="275" stroke="#e8c4a0" stroke-width="7"/>
  <text x="380" y="206" text-anchor="middle" font-size="10" fill="#1f2937">2</text>
  <!-- Runner 3 -->
  <circle cx="250" cy="210" r="15" fill="#fcd5b5"/>
  <ellipse cx="250" cy="240" rx="12" ry="18" fill="#22c55e"/>
  <line x1="240" y1="258" x2="228" y2="285" stroke="#fcd5b5" stroke-width="6"/>
  <line x1="260" y1="258" x2="275" y2="280" stroke="#fcd5b5" stroke-width="6"/>
  <text x="250" y="215" text-anchor="middle" font-size="8" fill="#1f2937">3</text>
  <!-- Finish line -->
  <rect x="530" y="240" width="10" height="70" fill="white"/>
  <rect x="530" y="240" width="10" height="10" fill="#1f2937"/>
  <rect x="530" y="260" width="10" height="10" fill="#1f2937"/>
  <rect x="530" y="280" width="10" height="10" fill="#1f2937"/>
  <rect x="530" y="300" width="10" height="10" fill="#1f2937"/>
  <!-- Cheering crowd (simplified) -->
  <ellipse cx="300" cy="380" rx="250" ry="60" fill="#78716c"/>
  <circle cx="150" cy="360" r="10" fill="#fcd5b5"/>
  <circle cx="200" cy="355" r="10" fill="#e8c4a0"/>
  <circle cx="250" cy="360" r="10" fill="#fcd5b5"/>
  <circle cx="350" cy="355" r="10" fill="#fcd5b5"/>
  <circle cx="400" cy="360" r="10" fill="#e8c4a0"/>
  <circle cx="450" cy="355" r="10" fill="#fcd5b5"/>
  <!-- Sun -->
  <circle cx="520" cy="60" r="35" fill="#fbbf24"/>
  <line x1="520" y1="15" x2="520" y2="0" stroke="#fbbf24" stroke-width="4"/>
  <line x1="560" y1="60" x2="580" y2="60" stroke="#fbbf24" stroke-width="4"/>
  <line x1="550" y1="30" x2="565" y2="15" stroke="#fbbf24" stroke-width="4"/>
  <line x1="550" y1="90" x2="565" y2="105" stroke="#fbbf24" stroke-width="4"/>
  <!-- Banner -->
  <rect x="100" y="120" width="200" height="40" fill="#1e40af" rx="5"/>
  <text x="200" y="145" text-anchor="middle" font-family="Arial" font-size="16" fill="white" font-weight="bold">SPORTS DAY 2025</text>
  <!-- Flags -->
  <rect x="50" y="80" width="3" height="100" fill="#6b7280"/>
  <polygon points="53,80 53,115 85,97" fill="#22c55e"/>
  <rect x="550" y="80" width="3" height="100" fill="#6b7280"/>
  <polygon points="553,80 553,115 520,97" fill="#22c55e"/>
</svg>
