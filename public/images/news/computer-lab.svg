<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="lab-room" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#lab-room)"/>
  <!-- Floor -->
  <rect x="0" y="320" width="600" height="80" fill="#cbd5e1"/>
  <!-- Wall pattern -->
  <line x1="0" y1="50" x2="600" y2="50" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="0" y1="100" x2="600" y2="100" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Desk Row 1 -->
  <rect x="30" y="200" width="160" height="60" fill="#78716c"/>
  <rect x="30" y="255" width="8" height="65" fill="#57534e"/>
  <rect x="182" y="255" width="8" height="65" fill="#57534e"/>
  <!-- Computer 1 -->
  <rect x="50" y="150" width="60" height="50" fill="#1f2937" rx="3"/>
  <rect x="55" y="155" width="50" height="35" fill="#60a5fa"/>
  <rect x="75" y="200" width="20" height="10" fill="#374151"/>
  <rect x="60" y="208" width="50" height="5" fill="#374151" rx="2"/>
  <!-- Keyboard -->
  <rect x="55" y="220" width="50" height="15" fill="#e5e7eb" rx="2"/>
  <!-- Computer 2 -->
  <rect x="120" y="150" width="60" height="50" fill="#1f2937" rx="3"/>
  <rect x="125" y="155" width="50" height="35" fill="#34d399"/>
  <rect x="145" y="200" width="20" height="10" fill="#374151"/>
  <rect x="130" y="208" width="50" height="5" fill="#374151" rx="2"/>
  <rect x="125" y="220" width="50" height="15" fill="#e5e7eb" rx="2"/>
  <!-- Desk Row 2 -->
  <rect x="220" y="200" width="160" height="60" fill="#78716c"/>
  <rect x="220" y="255" width="8" height="65" fill="#57534e"/>
  <rect x="372" y="255" width="8" height="65" fill="#57534e"/>
  <!-- Computer 3 -->
  <rect x="240" y="150" width="60" height="50" fill="#1f2937" rx="3"/>
  <rect x="245" y="155" width="50" height="35" fill="#f472b6"/>
  <rect x="265" y="200" width="20" height="10" fill="#374151"/>
  <rect x="250" y="208" width="50" height="5" fill="#374151" rx="2"/>
  <rect x="245" y="220" width="50" height="15" fill="#e5e7eb" rx="2"/>
  <!-- Computer 4 -->
  <rect x="310" y="150" width="60" height="50" fill="#1f2937" rx="3"/>
  <rect x="315" y="155" width="50" height="35" fill="#fbbf24"/>
  <rect x="335" y="200" width="20" height="10" fill="#374151"/>
  <rect x="320" y="208" width="50" height="5" fill="#374151" rx="2"/>
  <rect x="315" y="220" width="50" height="15" fill="#e5e7eb" rx="2"/>
  <!-- Desk Row 3 -->
  <rect x="410" y="200" width="160" height="60" fill="#78716c"/>
  <rect x="410" y="255" width="8" height="65" fill="#57534e"/>
  <rect x="562" y="255" width="8" height="65" fill="#57534e"/>
  <!-- Computer 5 -->
  <rect x="430" y="150" width="60" height="50" fill="#1f2937" rx="3"/>
  <rect x="435" y="155" width="50" height="35" fill="#818cf8"/>
  <rect x="455" y="200" width="20" height="10" fill="#374151"/>
  <rect x="440" y="208" width="50" height="5" fill="#374151" rx="2"/>
  <rect x="435" y="220" width="50" height="15" fill="#e5e7eb" rx="2"/>
  <!-- Computer 6 -->
  <rect x="500" y="150" width="60" height="50" fill="#1f2937" rx="3"/>
  <rect x="505" y="155" width="50" height="35" fill="#22d3ee"/>
  <rect x="525" y="200" width="20" height="10" fill="#374151"/>
  <rect x="510" y="208" width="50" height="5" fill="#374151" rx="2"/>
  <rect x="505" y="220" width="50" height="15" fill="#e5e7eb" rx="2"/>
  <!-- Whiteboard -->
  <rect x="150" y="20" width="300" height="100" fill="white" stroke="#94a3b8" stroke-width="3"/>
  <text x="300" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e40af">Computer Science</text>
  <text x="300" y="85" text-anchor="middle" font-family="monospace" font-size="12" fill="#374151">print("Hello World!")</text>
  <!-- AC unit -->
  <rect x="520" y="30" width="60" height="25" fill="#e5e7eb" rx="3"/>
  <rect x="525" y="40" width="50" height="8" fill="#94a3b8"/>
  <!-- Clock -->
  <circle cx="50" cy="50" r="20" fill="white" stroke="#374151" stroke-width="2"/>
  <line x1="50" y1="50" x2="50" y2="38" stroke="#1f2937" stroke-width="2"/>
  <line x1="50" y1="50" x2="60" y2="55" stroke="#1f2937" stroke-width="1.5"/>
  <!-- Plants -->
  <rect x="15" y="280" width="20" height="30" fill="#92400e"/>
  <circle cx="25" cy="265" r="20" fill="#22c55e"/>
  <circle cx="15" cy="270" r="12" fill="#16a34a"/>
</svg>
