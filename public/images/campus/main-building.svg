<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7dd3fc"/>
      <stop offset="100%" style="stop-color:#bae6fd"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="350" fill="url(#sky)"/>
  <!-- Ground -->
  <rect y="350" width="800" height="150" fill="#22c55e"/>
  <!-- Path -->
  <path d="M350 500 Q400 400 400 350 Q400 400 450 500" fill="#d1d5db"/>
  <!-- Main Building -->
  <rect x="150" y="150" width="500" height="200" fill="#fef3c7"/>
  <rect x="150" y="140" width="500" height="20" fill="#f59e0b"/>
  <!-- Dome -->
  <ellipse cx="400" cy="140" rx="80" ry="50" fill="#1e40af"/>
  <circle cx="400" cy="95" r="15" fill="#fbbf24"/>
  <!-- Windows Row 1 -->
  <rect x="180" y="180" width="50" height="60" fill="#60a5fa" rx="5"/>
  <rect x="250" y="180" width="50" height="60" fill="#60a5fa" rx="5"/>
  <rect x="320" y="180" width="50" height="60" fill="#60a5fa" rx="5"/>
  <rect x="430" y="180" width="50" height="60" fill="#60a5fa" rx="5"/>
  <rect x="500" y="180" width="50" height="60" fill="#60a5fa" rx="5"/>
  <rect x="570" y="180" width="50" height="60" fill="#60a5fa" rx="5"/>
  <!-- Windows Row 2 -->
  <rect x="180" y="260" width="50" height="60" fill="#60a5fa" rx="5"/>
  <rect x="250" y="260" width="50" height="60" fill="#60a5fa" rx="5"/>
  <rect x="500" y="260" width="50" height="60" fill="#60a5fa" rx="5"/>
  <rect x="570" y="260" width="50" height="60" fill="#60a5fa" rx="5"/>
  <!-- Main Door -->
  <rect x="350" y="250" width="100" height="100" fill="#7c2d12" rx="5"/>
  <rect x="355" y="255" width="42" height="90" fill="#92400e"/>
  <rect x="403" y="255" width="42" height="90" fill="#92400e"/>
  <circle cx="392" cy="300" r="5" fill="#fbbf24"/>
  <circle cx="408" cy="300" r="5" fill="#fbbf24"/>
  <!-- Steps -->
  <rect x="330" y="340" width="140" height="15" fill="#e5e7eb"/>
  <rect x="320" y="350" width="160" height="10" fill="#d1d5db"/>
  <!-- Trees -->
  <circle cx="80" cy="320" r="50" fill="#166534"/>
  <rect x="70" y="350" width="20" height="40" fill="#854d0e"/>
  <circle cx="720" cy="320" r="50" fill="#166534"/>
  <rect x="710" y="350" width="20" height="40" fill="#854d0e"/>
  <!-- Flag -->
  <rect x="398" y="50" width="4" height="50" fill="#6b7280"/>
  <rect x="402" y="50" width="40" height="25" fill="#22c55e"/>
  <!-- Sign -->
  <rect x="320" y="380" width="160" height="30" fill="white" rx="5"/>
  <text x="400" y="400" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e40af" font-weight="bold">AL-NOOR ACADEMY</text>
  <!-- Clouds -->
  <ellipse cx="100" cy="80" rx="50" ry="25" fill="white" opacity="0.8"/>
  <ellipse cx="130" cy="70" rx="40" ry="20" fill="white" opacity="0.8"/>
  <ellipse cx="650" cy="100" rx="60" ry="30" fill="white" opacity="0.8"/>
  <ellipse cx="700" cy="90" rx="45" ry="22" fill="white" opacity="0.8"/>
</svg>
